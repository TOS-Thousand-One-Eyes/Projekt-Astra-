[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astra"
version = "0.0.22"
description = "Astra - a personal AI assistant, built from scratch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mss>=10,<11",
  "Pillow>=11,<13",
  "psutil>=7,<8"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
astra = "main:main"
astra-gui = "gui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
  "actions",
  "automation",
  "commands",
  "config",
  "core",
  "dev",
  "experience",
  "gui",
  "identity",
  "learning",
  "memory",
  "modules",
  "research",
  "speech",
  "utils",
  "vision"
]
py-modules = ["main"]
